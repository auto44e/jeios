name: kernel checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build and emulation tools
        run: sudo apt-get update && sudo apt-get install -y gcc binutils make python3 grub-pc-bin grub-common xorriso qemu-system-x86
      - name: Core and ELF checks
        run: make check
      - name: Boot smoke
        run: make smoke
      - name: Legacy CPU profile without NX
        run: python3 tools/smoke.py build/0/jeios.iso --cpu qemu64,-nx --expect-nx absent
      - name: Low-memory legacy profile
        run: python3 tools/smoke.py build/0/jeios.iso --cpu qemu64,-nx --memory 16M --expect-nx absent
      - name: Large-memory clipping profile
        run: python3 tools/smoke.py build/0/jeios.iso --memory 1536M --expect-nx present
      - name: CPU exception and protection faults
        run: make integration
  aarch64:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM64 build and emulation tools
        run: sudo apt-get -o APT::Update::Error-Mode=any update && sudo apt-get install -y make python3 gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu qemu-system-arm
      - name: Record ARM64 toolchain and emulator versions
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -eu
          echo "Checked-out commit (git rev-parse HEAD; synthetic merge on pull_request):"
          git rev-parse HEAD
          echo "PR head SHA (empty on push): ${PR_HEAD_SHA}"
          echo "github.sha: ${WORKFLOW_SHA}"
          echo "Installed package versions:"
          dpkg-query -W -f='${Package} ${Version}\n' qemu-system-arm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu make python3
          aarch64-linux-gnu-gcc --version
          aarch64-linux-gnu-ld --version
          aarch64-linux-gnu-objcopy --version | head -n 1
          qemu-system-aarch64 --version
          qemu_version="$(qemu-system-aarch64 --version | awk 'NR == 1 { print $4 }')"
          case "$qemu_version" in
            8.2.[0-9]*) ;;
            *)
              echo "Unsupported QEMU version: $qemu_version (expected 8.2.x)" >&2
              exit 1
              ;;
          esac
      - name: Build ARM64 kernel
        run: make aarch64
      - name: ARM64 normal boot
        run: |
          make smoke-aarch64 ARM_REQUIRE=1 ARM_SMOKE_TIMEOUT=30
      - name: ARM64 deliberate vector fault
        run: |
          make smoke-aarch64 ARM_REQUIRE=1 ARM_VECTOR_TEST=1 ARM_SMOKE_TIMEOUT=30
      - name: ARM64 malformed DTB rejection
        run: |
          make smoke-aarch64 ARM_REQUIRE=1 ARM_DTB_BAD=1 ARM_SMOKE_TIMEOUT=30
      - name: ARM64 BSS validation
        run: |
          make smoke-aarch64 ARM_REQUIRE=1 ARM_BSS_CHECK=1 ARM_SMOKE_TIMEOUT=30
      - name: Upload ARM64 serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aarch64-serial-logs-${{ github.run_attempt }}
          path: build/aarch64*/serial.log
          retention-days: 30
          if-no-files-found: error
