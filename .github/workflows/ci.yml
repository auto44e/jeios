name: scaffold checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build and emulation tools
        run: sudo apt-get update && sudo apt-get install -y gcc binutils make python3 grub-pc-bin grub-common xorriso qemu-system-x86
      - name: Core and ELF checks
        run: make check
      - name: Boot smoke
        run: make smoke
      - name: Legacy CPU profile without NX
        run: python3 tools/smoke.py build/jeios.iso --cpu qemu64,-nx --expect-nx absent
